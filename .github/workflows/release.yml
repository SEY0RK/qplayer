name: release
# Builds the two installable packages, keeps them as workflow artifacts, and
# publishes them as a GitHub Release asset set.
#
# Trigger: Actions -> release -> Run workflow -> pick branch `local-v2`.
# The version input becomes both the release tag and title.
# (The upstream `release.yml` on the default branch registers the workflow path;
# this file replaces its behaviour when the run targets local-v2.)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version label for this build
        required: false
        default: '2.1.1-local.1'
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ime-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: IME baseline + deleted-state guard
        run: python .github/scripts/verify-ime-baseline.py
      - name: Patched engine branch must stay pinned
        run: python -c "import json; c=json.load(open('.github/ime-guard.json')); assert c['engine_ref']=='v0.2.39-ime' and c['engine_version']=='v0.2.39'; print('engine pin OK:', c['engine_repo'], c['engine_ref'])"

  android:
    needs: ime-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Checkout patched qml4j engine
        uses: actions/checkout@v4
        with:
          repository: SEY0RK/qml4j-ime
          ref: v0.2.39-ime
          token: ${{ secrets.QML4J_IME_REPO_TOKEN }}
          path: engine/qml4j-ime
      - name: Install patched qml4j into local Maven repo
        run: bash .github/scripts/install-qml4j-ime.sh
      - name: Restore self-contained signing key cache
        id: keycache
        uses: actions/cache/restore@v4
        with:
          path: .signing
          key: qplayer-android-debug-keystore-v1
      - name: Seed key from Secret (fail closed, never auto-generate)
        if: steps.keycache.outputs.cache-hit != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          EXPECT_SHA: ${{ secrets.ANDROID_DEBUG_KEYSTORE_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then echo "::error::signing key Secret unavailable - refusing to build with a new key"; exit 1; fi
          mkdir -p .signing
          printf '%s' "$KEYSTORE_B64" | base64 -d > .signing/debug.keystore
          test -s .signing/debug.keystore
          printf '{"alias":"androiddebugkey","sha256":"%s","source":"Actions Secret"}\n' "$EXPECT_SHA" > .signing/metadata.json
      - name: Verify key material before Gradle starts
        run: |
          test -s .signing/debug.keystore
          test -s .signing/metadata.json
      - name: Save self-contained signing cache
        if: steps.keycache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .signing
          key: qplayer-android-debug-keystore-v1
      - name: Place debug keystore where AGP expects it
        run: |
          mkdir -p "$HOME/.android"
          cp .signing/debug.keystore "$HOME/.android/debug.keystore"
      - name: Install player-core
        run: |
          mvn -q -B -N install
          mvn -q -B -DskipTests install -f player-core/pom.xml
      - name: Build perf APK (same package + same debug certificate)
        env:
          QPLAYER_PERF_KEYSTORE: ${{ github.workspace }}/.signing/debug.keystore
          QPLAYER_PERF_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
          QPLAYER_PERF_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
          QPLAYER_PERF_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
        run: |
          chmod +x android-shell/gradlew
          cd android-shell && ./gradlew --no-daemon :app:assemblePerf
      - name: Assert signing certificate SHA-256
        env:
          EXPECT_SHA: ${{ secrets.ANDROID_DEBUG_KEYSTORE_SHA256 }}
        run: bash .github/scripts/assert-android-signature.sh android-shell/app/build/outputs/apk/perf/app-perf.apk "$EXPECT_SHA"
      - name: Stage APK
        run: |
          mkdir -p out
          cp android-shell/app/build/outputs/apk/perf/app-perf.apk out/QPlayer-android-perf.apk
      - uses: actions/upload-artifact@v4
        with: { name: QPlayer-android, path: out/* }

  windows-portable:
    needs: ime-guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Set up Windows C++ toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Install WebView2 build SDK
        shell: pwsh
        run: |
          $sdkRoot = "$env:RUNNER_TEMP\webview2-sdk"
          nuget install Microsoft.Web.WebView2 -Version 1.0.2592.51 -OutputDirectory $sdkRoot -NonInteractive -Source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw "WebView2 SDK download failed" }
          "WEBVIEW2_SDK=$sdkRoot\Microsoft.Web.WebView2.1.0.2592.51" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CXX=cl.exe" >> $env:GITHUB_ENV
      - name: Checkout patched qml4j engine
        uses: actions/checkout@v4
        with:
          repository: SEY0RK/qml4j-ime
          ref: v0.2.39-ime
          token: ${{ secrets.QML4J_IME_REPO_TOKEN }}
          path: engine/qml4j-ime
      - name: Install patched qml4j into local Maven repo
        shell: bash
        run: bash .github/scripts/install-qml4j-ime.sh
      - name: Install Maven reactor prerequisites
        shell: bash
        run: |
          mvn -q -B -N install
          mvn -q -B -DskipTests install -f player-core/pom.xml
          mvn -q -B -DskipTests install -f qml-aot-tool/pom.xml
      - name: Build JVM portable zip (no data dir)
        run: ./.github/scripts/package-jvm-portable.ps1 -AppVersion "${{ inputs.version || github.ref_name }}"
      - name: Verify zip contents and cfg encoding
        run: ./.github/scripts/verify-cfg-no-bom.ps1
      - name: Verify jar consistency
        run: python .github/scripts/verify-jar-consistency.py
      - uses: actions/upload-artifact@v4
        with:
          name: QPlayer-windows-jvm-portable
          path: desktop-host/target/QPlayer-windows-x64-portable.zip

  bundle:
    # One artifact with both packages, so a single download is enough.
    needs: [android, windows-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Verify both packages are present and non-trivial
        run: python .github/scripts/verify-release-assets.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: QPlayer-local-build
          path: dist/*

  release:
    # Publish only after both packages are built and verified.
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with: { name: QPlayer-local-build, path: dist }
      - name: Prepare release notes
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          QPlayer $VERSION (local-v2)

          Built from branch local-v2, based on upstream v2.1.1.

          - Windows: JVM portable zip (JDK 21 + jlink + jpackage), no `data` directory.
          - Android: `perf` variant, signed with the repository signing key.
          - Included: Windows IME reproduction, local-playlist device sync,
            search source filter, upstream features from v2.1.1.

          Platform playlists keep syncing through their own music-platform accounts;
          device sync here only merges LOCAL playlists (one-way sender -> receiver).
          EOF
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" dist/* \
            --title "QPlayer $VERSION" \
            --notes-file release-notes.md
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
